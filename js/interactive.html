<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive SVG Export</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding-top: 50px;
            background-color: #f0f2f5;
        }
        #canvas-container {
            border: 1px solid #ccc;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            background-color: #2ecc71;
            color: white;
            border-radius: 4px;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #27ae60;
        }
        
        /* 
           CSS Animations for the SVG element.
           We use transform-origin so it scales from its own center.
        */
        .interactive-rect {
            cursor: pointer;
            transform-origin: 150px 100px; /* Center of the rectangle (50 + 200/2, 25 + 150/2) */
            transition: opacity 0.2s;
        }

        /* Hover Pulse Effect: grows for 0.5s then returns to normal */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        .interactive-rect:hover {
            animation: pulse 0.5s ease-in-out forwards;
            opacity: 0.95; /* Slight opacity shift on hover */
        }

        /* Active click state */
        .interactive-rect:active {
            opacity: 0.7;
        }

        /* Ensure the text ignores mouse events so it doesn't interrupt the rectangle's hover state */
        .svg-text {
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    <button id="export-btn">Export as .svg</button>

    <script>
        const svgNS = "http://w3.org";

        // 1. Create SVG container
        const svgElement = document.createElementNS(svgNS, "svg");
        svgElement.setAttribute("width", "300");
        svgElement.setAttribute("height", "200");
        svgElement.setAttribute("viewBox", "0 0 300 200");

        // 2. Create Rectangle with interactive class
        const rect = document.createElementNS(svgNS, "rect");
        rect.setAttribute("x", "50");
        rect.setAttribute("y", "25");
        rect.setAttribute("width", "200");
        rect.setAttribute("height", "150");
        rect.setAttribute("fill", "#3498db");
        rect.setAttribute("opacity", "0.8");
        rect.setAttribute("rx", "10");
        rect.setAttribute("class", "interactive-rect"); // Attach CSS behaviors

        // 3. Create Text
        const text = document.createElementNS(svgNS, "text");
        text.setAttribute("x", "150");
        text.setAttribute("y", "115");
        text.setAttribute("fill", "#ffffff");
        text.setAttribute("font-size", "70");
        text.setAttribute("font-weight", "bold");
        text.setAttribute("text-anchor", "middle");
        text.setAttribute("class", "svg-text"); // Ignore pointer events
        text.textContent = "A";

        svgElement.appendChild(rect);
        svgElement.appendChild(text);
        document.getElementById("canvas-container").appendChild(svgElement);

        // 4. Export Functionality
        document.getElementById("export-btn").addEventListener("click", () => {
            // Embed the required CSS directly inside the exported SVG so the animation stays intact
            const styleElement = document.createElementNS(svgNS, "style");
            styleElement.textContent = `
                .interactive-rect {
                    cursor: pointer;
                    transform-origin: 150px 100px;
                    transition: opacity 0.2s;
                }
                @keyframes pulse {
                    0% { transform: scale(1); }
                    50% { transform: scale(1.15); }
                    100% { transform: scale(1); }
                }
                .interactive-rect:hover {
                    animation: pulse 0.5s ease-in-out forwards;
                    opacity: 0.95;
                }
                .interactive-rect:active {
                    opacity: 0.7;
                }
                .svg-text { pointer-events: none; }
            `;
            
            // Temporarily append the styles to the SVG root for serialization
            svgElement.insertBefore(styleElement, svgElement.firstChild);

            const serializer = new XMLSerializer();
            let source = serializer.serializeToString(svgElement);

            // Clean up the live DOM SVG by removing the temporary style tag
            svgElement.removeChild(styleElement);

            // Add Namespaces & XML header
            if (!source.match(/^<svg[^>]+xmlns="http:\/\/www\.w3\.org\/2000\/svg"/)) {
                source = source.replace(/^<svg/, '<svg xmlns="http://w3.org"');
            }
            source = '<?xml version="1.0" encoding="utf-8"?>\n' + source;

            // Trigger Download
            const url = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(source);
            const downloadLink = document.createElement("a");
            downloadLink.href = url;
            downloadLink.download = "interactive-rectangle.svg";
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        });
    </script>

</body>
</html>
